[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NoLimitsPy"
version = "0.2.0"
description = "Python interface to NoLimits.jl, nonlinear mixed-effects analysis of longitudinal data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Manuel Huth" }]
dependencies = ["juliacall>=0.9.20"]

[project.optional-dependencies]
test = ["pytest", "pandas"]

[tool.hatch.build.targets.wheel]
packages = ["src/NoLimitsPy"]
